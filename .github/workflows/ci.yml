name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  # The `t` tcalc is checked with. Bump both together, from the release's
  # asset digest: `gh release view vX.Y.Z -R lkurcak/t-lang --json assets`.
  T_VERSION: v0.28.0
  T_SHA256: 291e2fb174841054edab79094bed9d9fc08719427889034dec70335788f09a75

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install t
        run: |
          name="t-lang-${T_VERSION}-x86_64-unknown-linux-gnu"
          curl -fsSL -o t.tar.gz \
            "https://github.com/lkurcak/t-lang/releases/download/${T_VERSION}/${name}.tar.gz"
          echo "${T_SHA256}  t.tar.gz" | sha256sum -c -
          mkdir -p "$HOME/.local/bin"
          tar xzf t.tar.gz
          mv "${name}/t" "$HOME/.local/bin/t"
          rm -r t.tar.gz "${name}"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: t --version
      - run: tests/run.sh
