name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    uses: lkurcak/forge/.github/workflows/t-ci.yml@v1
    with:
      # The `t` this repo is checked with. Bump both together, from the
      # release's asset digest: gh release view vX.Y.Z -R lkurcak/t-lang --json assets
      t-version: v0.77.0
      t-sha256: 2aa2c7f8bfdca1104d906d95f4b4b2a615daa372a26776fe49e697e86030139b
